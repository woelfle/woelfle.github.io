<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Layered boxes representing architecture layers -->
  <rect x="300" y="240" width="600" height="60" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
  <text x="600" y="278" text-anchor="middle" font-size="20" fill="#ecf0f1">Presentation</text>

  <rect x="340" y="320" width="520" height="60" rx="8" fill="#3498db" opacity="0.75"/>
  <text x="600" y="358" text-anchor="middle" font-size="20" fill="#ecf0f1">Application</text>

  <rect x="380" y="400" width="440" height="60" rx="8" fill="#3498db" opacity="0.55"/>
  <text x="600" y="438" text-anchor="middle" font-size="20" fill="#ecf0f1">Data</text>

  <!-- Connecting lines -->
  <line x1="600" y1="300" x2="600" y2="320" stroke="#ecf0f1" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="380" x2="600" y2="400" stroke="#ecf0f1" stroke-width="2" opacity="0.6"/>

  <!-- Title and subtitle -->
  <text x="600" y="60" text-anchor="middle" font-size="48" font-weight="bold" fill="#ecf0f1">Thinking in Systems</text>
  <text x="600" y="105" text-anchor="middle" font-size="28" fill="#3498db">Software Architecture: Patterns, Principles &amp; Trade-offs</text>
</svg>
