<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background node (center) -->
  <circle cx="100" cy="100" r="42" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="2"/>

  <!-- Inner connection points (4 nodes) -->
  <circle cx="100" cy="70" r="5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="130" cy="100" r="5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="100" cy="130" r="5" fill="#white" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="70" cy="100" r="5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>

  <!-- Connection edges (from center to inner nodes) -->
  <line x1="100" y1="58" x2="100" y2="70" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="130" y2="100" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="100" y1="130" x2="100" y2="142" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="70" y1="100" x2="80" y2="100" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Outer nodes (8 nodes) forming a ring -->
  <circle cx="100" cy="36" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="128" cy="48" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="152" cy="80" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="152" cy="120" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="128" cy="152" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="100" cy="164" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="72" cy="152" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="48" cy="120" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="48" cy="80" r="3.5" fill="#ffffff" stroke="url(#logoGradient)" stroke-width="1"/>
  <circle cx="72" cy="48" r="3.5" fill="#white" stroke="url(#logoGradient)" stroke-width="1"/>

  <!-- Subtle outer ring -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.15"/>
</svg>
