<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Performance curve -->
  <polyline points="200,420 260,400 320,390 380,380 440,365 500,340 560,310 620,285 680,270 740,262 800,258 860,257 920,257 980,257 1000,257"
             fill="none" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="257" x2="1000" y2="257" stroke="#ecf0f1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Axes -->
  <line x1="200" y1="440" x2="1000" y2="440" stroke="#ecf0f1" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="440" x2="200" y2="230" stroke="#ecf0f1" stroke-width="2" opacity="0.6"/>

  <!-- Title and subtitle -->
  <text x="600" y="60" text-anchor="middle" font-size="48" font-weight="bold" fill="#ecf0f1">Thinking in Systems</text>
  <text x="600" y="105" text-anchor="middle" font-size="28" fill="#e74c3c">Performance Engineering: Measuring &amp; Tuning Systems</text>
</svg>
