<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Pipeline stages -->
  <circle cx="330" cy="315" r="55" fill="url(#accentGradient)" stroke="#ecf0f1" stroke-width="2"/>
  <text x="330" y="320" text-anchor="middle" font-size="18" fill="#ecf0f1">Build</text>

  <circle cx="600" cy="315" r="55" fill="url(#accentGradient)" stroke="#ecf0f1" stroke-width="2"/>
  <text x="600" y="320" text-anchor="middle" font-size="18" fill="#ecf0f1">Test</text>

  <circle cx="870" cy="315" r="55" fill="url(#accentGradient)" stroke="#ecf0f1" stroke-width="2"/>
  <text x="870" y="320" text-anchor="middle" font-size="18" fill="#ecf0f1">Deploy</text>

  <!-- Connecting arrows -->
  <line x1="390" y1="315" x2="535" y2="315" stroke="#ecf0f1" stroke-width="3" opacity="0.6"/>
  <polygon points="540,315 525,308 525,322" fill="#ecf0f1" opacity="0.6"/>
  <line x1="660" y1="315" x2="805" y2="315" stroke="#ecf0f1" stroke-width="3" opacity="0.6"/>
  <polygon points="810,315 795,308 795,322" fill="#ecf0f1" opacity="0.6"/>

  <!-- Title and subtitle -->
  <text x="600" y="60" text-anchor="middle" font-size="48" font-weight="bold" fill="#ecf0f1">Thinking in Systems</text>
  <text x="600" y="105" text-anchor="middle" font-size="28" fill="#3498db">Engineering Practices: Pipelines, Observability &amp; Refactoring</text>
</svg>
