# =============================================================================
# Hugo Site Configuration for LoveIt Theme
# =============================================================================

baseURL = 'https://thomaswoelfle.com'
languageCode = 'en-us'
languageName = 'English'
title = 'Thinking in Systems - A System of Thoughts'
theme = 'github.com/dillonzq/LoveIt'

# Minification configuration (Hugo v0.150+)
# Reduces file sizes for production deployments
[minify]
  minifyOutput = true
  [minify.tdewolff.css]
    version = 4  # CSS 4 allows modern features
  [minify.tdewolff.js]
    keepVars = false  # Optimize JS variable names
  [minify.tdewolff.json]
    keepNumbers = false  # Reduce JSON file size

# -----------------------------------------------------------------------------
# Output Formats (HTML + RSS for feeds, JSON for search)
# Minification applied globally reduces JSON index size for faster search
# See: https://gohugo.io/getting-started/configuration/#output-formats
# -----------------------------------------------------------------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Custom output format configuration for JSON search index
[outputFormats.JSON]
  isPlainText = true
  mediaType = "application/json"
  # Note: minification is handled by global 'minify = true' setting

# -----------------------------------------------------------------------------
# Taxonomies
# -----------------------------------------------------------------------------
[taxonomies]
  tag = "tags"
  category = "categories"

# -----------------------------------------------------------------------------
# Markup Settings (required for proper syntax highlighting & HTML in markdown)
# -----------------------------------------------------------------------------
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# -----------------------------------------------------------------------------
# Privacy Settings (disable all external analytics and tracking)
# -----------------------------------------------------------------------------
[privacy]
  [privacy.googleAnalytics]
    disable = true
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true
  [privacy.vimeo]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.disqus]
    disable = true

# -----------------------------------------------------------------------------
# Menu Configuration
# -----------------------------------------------------------------------------
[[menus.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 1
  [menus.main.params]
    icon = "fa-solid fa-home"

[[menus.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 2
  [menus.main.params]
    icon = "fa-solid fa-file-lines fa-archive"

[[menus.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 3
  [menus.main.params]
    icon = "fa-solid fa-tags"

[[menus.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 4
  [menus.main.params]
    icon = "fa-solid fa-folder"

[[menus.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 5
  [menus.main.params]
    icon = "fa-solid fa-user"

# -----------------------------------------------------------------------------
# Theme Parameters
# -----------------------------------------------------------------------------
[params]
  # Site description for SEO
  description = "Thinking in Systems - A System of Thoughts - A private software engineering blog exploring architecture, methodologies, and systems thinking."
  
  # Keywords for SEO
  keywords = ["software engineering", "systems thinking", "architecture", "design patterns", "software design"]
  
  # Default images for OpenGraph/Twitter cards
  images = ["/images/logo.svg"]
  
  # Date format
  dateFormat = "2006-01-02"
  
  # Theme mode: "auto", "light", "dark"
  defaultTheme = "auto"
  
  # Enable/disable fingerprinting for assets
  fingerprint = "sha256"
  
  # Author information
  [params.author]
    name = "Thomas Wölfle"
    link = ""

  # -----------------------------------------------------------------------------
  # Header Settings
  # -----------------------------------------------------------------------------
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = "/images/logo.svg"
      name = "Thinking in Systems"
      typeit = false

  # -----------------------------------------------------------------------------
  # Footer Settings
  # -----------------------------------------------------------------------------
  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2026

  # -----------------------------------------------------------------------------
  # Home Page Settings
  # -----------------------------------------------------------------------------
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.svg"
      title = "Thinking in Systems"
      subtitle = "A System of Thoughts"
      typeit = true
      social = false  # Disabled for privacy
    [params.home.posts]
      enable = true
      paginate = 10

  # -----------------------------------------------------------------------------
  # Social Links (disabled for privacy - private blog)
  # -----------------------------------------------------------------------------
  [params.social]
    RSS = true

  # -----------------------------------------------------------------------------
  # Search Configuration
  # -----------------------------------------------------------------------------
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = "Search..."
    maxResultLength = 10
    snippetLength = 50
    highlightTag = "em"
    absoluteURL = false

  # -----------------------------------------------------------------------------
  # Page Settings
  # -----------------------------------------------------------------------------
  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = true
    ruby = true
    fraction = true
    fontawesome = true
    linkToMarkdown = false
    rssFullText = true
    
    # Table of Contents
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    
    # Code block settings
    [params.page.code]
      copy = true
      maxShownLines = 50
    
    # Math rendering (KaTeX)
    # Disabled globally to optimize bundle size
    # Enable per-post by adding to front matter:
    #   [math]
    #     enable = true
    #     copyTex = true
    [params.page.math]
      enable = false
      copyTex = true
      mhchem = false
    
    # Share buttons (disabled for privacy)
    [params.page.share]
      enable = false
    
    # Comments (disabled for privacy)
    [params.page.comment]
      enable = false

  # -----------------------------------------------------------------------------
  # Analytics (disabled for privacy)
  # -----------------------------------------------------------------------------
  [params.analytics]
    enable = false

  # -----------------------------------------------------------------------------
  # Cookie Consent (disabled - no tracking)
  # -----------------------------------------------------------------------------
  [params.cookieconsent]
    enable = false

  # -----------------------------------------------------------------------------
  # Section Page (Archive) Settings
  # -----------------------------------------------------------------------------
  [params.section]
    paginate = 20
    dateFormat = "2006-01-02"
    rss = 10

  # -----------------------------------------------------------------------------
  # List Page Settings
  # -----------------------------------------------------------------------------
  [params.list]
    paginate = 20
    dateFormat = "2006-01-02"
    rss = 10

  # -----------------------------------------------------------------------------
  # Site Verification (disabled - for private blog)
  # Search engine verification meta tags. Leave empty for private blogs.
  # 
  # To enable when making the site public:
  # 1. Submit your site to each search engine's webmaster tools
  # 2. Copy the verification code provided by each service
  # 3. Paste the code in the corresponding field below
  # 
  # Supported services:
  # - google: Google Search Console (meta tag verification)
  # - bing: Bing Webmaster Tools
  # - yandex: Yandex Webmaster
  # - pinterest: Pinterest Site Verification
  # - baidu: Baidu Webmaster Tools (for Chinese SEO)
  # 
  # Example (DO NOT use - for reference only):
  # [params.siteVerification]
  #   google = "abcdef123456789xyz"
  #   bing = "987654321zyxwvu"
  #
  # LoveIt theme automatically generates:
  # <meta name="google-site-verification" content="..." />
  # <meta name="msvalidate.01" content="..." />
  # <meta name="yandex-verification" content="..." />
  # etc.
  # 
  # Privacy note: Enabling verification requires submitting your site to
  # search engines, which may affect your privacy preferences.
  # Keep disabled if you want to maintain a completely private blog.
  # 
  # Status: ✅ Correctly disabled for privacy-first approach
  # Last updated: 2026-01-27
  # Reference: https://hugoloveit.com/theme-documentation-basics/
  # 
  # Format: Always use plain verification codes without "google-site-verification=" prefix
  # The LoveIt theme handles the proper meta tag formatting.
  # 
  # Maintenance note: Search engines periodically renew verification codes.
  # Plan to check and update these values annually if enabled.
  # -----------------------------------------------------------------------------
  [params.siteVerification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

  # -----------------------------------------------------------------------------
  # TypeIt Animation Configuration
  # -----------------------------------------------------------------------------
  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1
