<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Learning journey as expanding system nodes -->
  <!-- Starting node -->
  <circle cx="300" cy="380" r="24" fill="#059669" stroke="#ffffff" stroke-width="2"/>

  <!-- Growing nodes along the path -->
  <circle cx="420" cy="350" r="28" fill="#059669" opacity="0.85" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="540" cy="320" r="32" fill="#059669" opacity="0.8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="660" cy="290" r="36" fill="url(#nodeGradient)" opacity="0.85" stroke="#ffffff" stroke-width="2"/>
  <circle cx="780" cy="260" r="40" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
  <circle cx="900" cy="230" r="44" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>

  <!-- Learning path edges -->
  <path d="M300 380 Q360 365 420 350 Q480 335 540 320 Q600 305 660 290 Q720 275 780 260 Q840 245 900 230"
        fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>

  <!-- Feedback connections -->
  <line x1="300" y1="380" x2="900" y2="230" stroke="#059669" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>
  <line x1="420" y1="350" x2="780" y2="260" stroke="#059669" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>

  <!-- Knowledge nodes branching off -->
  <circle cx="470" cy="310" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="270" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="720" cy="245" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- Outer growth ring -->
  <circle cx="600" cy="315" r="180" fill="none" stroke="#10b981" stroke-width="1" opacity="0.1"/>
  <circle cx="600" cy="315" r="200" fill="none" stroke="#10b981" stroke-width="1" opacity="0.05"/>

  <text x="600" y="55" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">Thinking in Systems</text>
  <text x="600" y="100" text-anchor="middle" font-size="26" fill="#10b981">Continuous Learning: A Systems Approach to Growth</text>
</svg>
