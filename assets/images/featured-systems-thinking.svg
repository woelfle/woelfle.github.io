<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- System nodes (circles) -->
  <!-- Center node -->
  <circle cx="600" cy="315" r="50" fill="url(#accentGradient)" stroke="#ecf0f1" stroke-width="2"/>
  <text x="600" y="320" text-anchor="middle" font-size="24" font-weight="bold" fill="#ecf0f1">System</text>
  
  <!-- Top left node -->
  <circle cx="300" cy="150" r="40" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
  <text x="300" y="158" text-anchor="middle" font-size="14" fill="#ecf0f1">Component</text>
  
  <!-- Top right node -->
  <circle cx="900" cy="150" r="40" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
  <text x="900" y="158" text-anchor="middle" font-size="14" fill="#ecf0f1">Component</text>
  
  <!-- Bottom left node -->
  <circle cx="250" cy="480" r="40" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
  <text x="250" y="488" text-anchor="middle" font-size="14" fill="#ecf0f1">Component</text>
  
  <!-- Bottom right node -->
  <circle cx="950" cy="480" r="40" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
  <text x="950" y="488" text-anchor="middle" font-size="14" fill="#ecf0f1">Component</text>
  
  <!-- Connecting lines (system relationships) -->
  <!-- Center to top left -->
  <line x1="570" y1="280" x2="330" y2="180" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <circle cx="450" cy="230" r="3" fill="#e74c3c" opacity="0.8"/>
  
  <!-- Center to top right -->
  <line x1="630" y1="280" x2="870" y2="180" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <circle cx="750" cy="230" r="3" fill="#e74c3c" opacity="0.8"/>
  
  <!-- Center to bottom left -->
  <line x1="565" y1="355" x2="285" y2="510" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <circle cx="425" cy="432" r="3" fill="#e74c3c" opacity="0.8"/>
  
  <!-- Center to bottom right -->
  <line x1="635" y1="355" x2="915" y2="510" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <circle cx="775" cy="432" r="3" fill="#e74c3c" opacity="0.8"/>
  
  <!-- Cross connections (feedback loops) -->
  <line x1="320" y1="175" x2="880" y2="175" stroke="#e74c3c" stroke-width="1.5" opacity="0.4"/>
  <line x1="270" y1="505" x2="930" y2="505" stroke="#e74c3c" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Title and subtitle -->
  <text x="600" y="60" text-anchor="middle" font-size="48" font-weight="bold" fill="#ecf0f1">Thinking in Systems</text>
  <text x="600" y="105" text-anchor="middle" font-size="28" fill="#3498db">Systems Thinking in Software Architecture</text>
</svg>