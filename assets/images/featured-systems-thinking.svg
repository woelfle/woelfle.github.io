<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Node network representing interconnected systems -->
  <!-- Central node -->
  <circle cx="600" cy="315" r="48" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
  <!-- Surrounding nodes -->
  <circle cx="400" cy="180" r="28" fill="#3b82f6" opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="800" cy="180" r="28" fill="#3b82f6" opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="400" cy="450" r="28" fill="#3b82f6" opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="800" cy="450" r="28" fill="#3b82f6" opacity="0.7" stroke="#93c5fd" stroke-width="1"/>

  <!-- Feedback loop connections -->
  <line x1="400" y1="180" x2="800" y2="180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="400" y1="450" x2="800" y2="450" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Causal links to center -->
  <line x1="400" y1="180" x2="568" y2="273" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="800" y1="180" x2="632" y2="273" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="450" x2="568" y2="357" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="800" y1="450" x2="632" y2="357" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer ring -->
  <circle cx="600" cy="315" r="120" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  <circle cx="600" cy="315" r="140" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.05"/>

  <text x="600" y="55" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">Thinking in Systems</text>
  <text x="600" y="100" text-anchor="middle" font-size="26" fill="#60a5fa">Systems Thinking in Software Architecture</text>
</svg>
