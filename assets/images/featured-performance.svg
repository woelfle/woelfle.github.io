<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Performance curve through system nodes -->
  <!-- Measurement nodes along the curve -->
  <circle cx="200" cy="420" r="18" fill="#ef4444" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <circle cx="280" cy="380" r="18" fill="#ef4443" opacity="0.6" stroke="#ffffff" stroke-width="1"/>
  <circle cx="360" cy="350" r="18" fill="#ef4443" opacity="0.7" stroke="#ffffff" stroke-width="1"/>
  <circle cx="440" cy="320" r="18" fill="#ef4443" opacity="0.8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="520" cy="290" r="18" fill="#ef4443" opacity="0.85" stroke="#ffffff" stroke-width="1"/>
  <circle cx="600" cy="270" r="20" fill="#ef4443" opacity="0.9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="680" cy="265" r="20" fill="#ef4443" stroke="#ffffff" stroke-width="2"/>
  <circle cx="760" cy="262" r="20" fill="#ef4443" stroke="#ffffff" stroke-width="2"/>
  <circle cx="840" cy="260" r="20" fill="#ef4443" stroke="#ffffff" stroke-width="2"/>
  <circle cx="920" cy="258" r="20" fill="#ef4443" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1000" cy="257" r="18" fill="#ef4443" opacity="0.9" stroke="#ffffff" stroke-width="1"/>

  <!-- Performance curve path -->
  <path d="M200,420 L280,380 L360,350 L440,320 L520,290 L600,270 L680,265 L760,262 L840,260 L920,258 L1000,257"
        fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <!-- Baseline (optimal threshold) -->
  <line x1="200" y1="257" x2="1000" y2="257" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>

  <!-- Axes -->
  <line x1="200" y1="440" x2="1000" y2="440" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="440" x2="200" y2="230" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>

  <!-- Measurement indicators -->
  <circle cx="600" cy="270" r="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>

  <text x="600" y="55" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">Thinking in Systems</text>
  <text x="600" y="100" text-anchor="middle" font-size="26" fill="#ef4444">Performance Engineering: Measuring &amp; Tuning Systems</text>
</svg>
