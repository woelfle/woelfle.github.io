<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Architecture layers as nested system nodes -->
  <!-- Outer layer (boundary) -->
  <rect x="250" y="140" width="700" height="360" rx="16" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>

  <!-- Layer 1: Presentation -->
  <rect x="320" y="170" width="560" height="64" rx="8" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="1"/>
  <!-- Layer 2: Business Logic -->
  <rect x="360" y="254" width="480" height="64" rx="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
  <!-- Layer 3: Data -->
  <rect x="400" y="338" width="400" height="64" rx="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

  <!-- Connection nodes at layer boundaries -->
  <circle cx="600" cy="234" r="6" fill="#ffffff"/>
  <circle cx="600" cy="322" r="6" fill="#ffffff"/>
  <circle cx="600" cy="402" r="6" fill="#ffffff"/>

  <!-- Vertical data flow edges -->
  <line x1="600" y1="234" x2="600" y2="322" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="600" y1="322" x2="600" y2="402" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Horizontal communication edges -->
  <line x1="320" y1="170" x2="880" y2="170" stroke="#93c5fd" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="300" x2="840" y2="300" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="400" x2="800" y2="400" stroke="#93c5fd" stroke-width="1" opacity="0.3"/>

  <text x="600" y="55" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">Thinking in Systems</text>
  <text x="600" y="100" text-anchor="middle" font-size="26" fill="#60a5fa">Software Architecture: Patterns, Principles &amp; Trade-offs</text>
</svg>
