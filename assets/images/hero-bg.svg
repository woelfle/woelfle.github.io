<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="heroNodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background is transparent to let CSS background show -->

  <!-- Subtle node network background pattern -->
  <!-- Left cluster -->
  <circle cx="150" cy="200" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="165" cy="185" r="1.5" fill="#3b82f6" opacity="0.3"/>
  <circle cx="180" cy="215" r="1.5" fill="#3b82f6" opacity="0.3"/>
  <line x1="150" y1="200" x2="165" y2="185" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <line x1="150" y1="200" x2="180" y2="215" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <line x1="165" y1="185" x2="180" y2="215" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>

  <!-- Center cluster -->
  <circle cx="300" cy="180" r="3" fill="#ffffff" opacity="0.15"/>
  <circle cx="315" cy="220" r="2.5" fill="#3b82f6" opacity="0.3"/>
  <circle cx="340" cy="190" r="2" fill="#3b82f6" opacity="0.25"/>
  <circle cx="320" cy="165" r="2" fill="#3b82f6" opacity="0.2"/>
  <line x1="300" y1="180" x2="315" y2="220" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="180" x2="340" y2="190" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="180" x2="320" y2="165" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>

  <!-- Right cluster -->
  <circle cx="500" cy="200" r="2.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="515" cy="175" r="2" fill="#3b82f6" opacity="0.25"/>
  <circle cx="525" cy="225" r="2" fill="#3b82f6" opacity="0.25"/>
  <line x1="500" y1="200" x2="515" y2="175" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <line x1="500" y1="200" x2="525" y2="225" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>

  <!-- Connecting line across -->
  <line x1="180" y1="215" x2="300" y2="180" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <line x1="340" y1="190" x2="500" y2="200" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>

  <!-- Right side clusters -->
  <circle cx="700" cy="170" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="720" cy="200" r="2.5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="750" cy="185" r="2" fill="#3b82f6" opacity="0.15"/>
  <circle cx="800" cy="210" r="3" fill="#ffffff" opacity="0.1"/>
  <line x1="700" y1="170" x2="720" y2="200" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="200" x2="750" y2="185" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="200" x2="800" y2="210" stroke="#60a5fa" stroke-width="1" opacity="0.1"/>

  <!-- Bottom-right cluster -->
  <circle cx="950" cy="230" r="2" fill="#ffffff" opacity="0.08"/>
  <circle cx="1000" cy="190" r="2.5" fill="#3b82f6" opacity="0.15"/>
  <circle cx="1050" cy="240" r="2" fill="#3b82f6" opacity="0.1"/>
  <line x1="1000" y1="190" x2="1050" y2="240" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
