<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="siteLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#siteLogoGradient)"/>

  <!-- Subtle grid pattern (faint) -->
  <circle cx="60" cy="60" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="140" cy="60" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="60" cy="140" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="140" cy="140" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="100" cy="40" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="100" cy="160" r="2" fill="#ffffff" opacity="0.15"/>

  <!-- Center node -->
  <circle cx="100" cy="100" r="35" fill="#ffffff" stroke="#ffffff" stroke-width="1" opacity="0.95"/>

  <!-- Inner nodes (top, right, bottom, left) -->
  <circle cx="100" cy="65" r="4" fill="#2563eb"/>
  <circle cx="135" cy="100" r="4" fill="#2563eb"/>
  <circle cx="100" cy="135" r="4" fill="#2563eb"/>
  <circle cx="65" cy="100" r="4" fill="#2563eb"/>

  <!-- Connection lines -->
  <line x1="100" y1="65" x2="100" y2="65" stroke="url(#siteLogoGradient)" stroke-width="0"/>
  <line x1="100" y1="100" x2="135" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="100" x2="100" y2="135" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Outer ring nodes -->
  <circle cx="80" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="120" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="120" r="2.5" fill="#ffffff" opacity="0.6"/>

  <!-- Subtle outer ring -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
</svg>
