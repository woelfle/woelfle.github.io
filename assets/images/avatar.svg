<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGradient)" />
  
  <!-- Head -->
  <circle cx="100" cy="75" r="30" fill="#ffffff" opacity="0.95" />
  
  <!-- Shoulders/Body -->
  <ellipse cx="100" cy="130" rx="45" ry="40" fill="#ffffff" opacity="0.95" />
  
  <!-- Left eye -->
  <circle cx="90" cy="70" r="4" fill="#333333" />
  
  <!-- Right eye -->
  <circle cx="110" cy="70" r="4" fill="#333333" />
  
  <!-- Smile -->
  <path d="M 90 80 Q 100 85 110 80" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Decorative element -->
  <circle cx="130" cy="60" r="8" fill="#ffffff" opacity="0.6" />
  <circle cx="70" cy="140" r="6" fill="#ffffff" opacity="0.6" />
</svg>