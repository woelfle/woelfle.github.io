---
# =============================================================================
# CI Pipeline for the Hugo blog (GitHub Actions)
#
# Triggers:
#   - push to main          -> lint + build (validation only)
#   - pull requests         -> lint + build (validation only)
#
# Hosting: the site is deployed by IONOS Deploy Now, which runs ./build.sh
# on every push to the connected repository. This workflow only validates
# the code; it no longer deploys to GitHub Pages.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        # npm install (no lockfile is committed yet; switch to `npm ci`
        # once a package-lock.json exists for reproducible installs).
        run: npm install --no-audit --no-fund

      - name: Lint Markdown
        run: npm run lint:md

      - name: Lint post summaries
        run: npm run lint:summary

      - name: Lint Taxonomies (controlled vocabulary)
        run: npm run lint:taxonomies

      - name: Lint YAML
        run: |
          pip3 install --user yamllint
          "$HOME/.local/bin/yamllint" .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Keep in sync with the version in .hugo-version and build.sh
          hugo-version: "0.165.0"
          extended: true

      - name: Build site
        run: hugo --minify
